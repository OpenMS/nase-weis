spec_version: 1
template:
  repository: OpenMS/streamlit-template
  branch: main
app:
  slug: naseweis
  name: NASEWEIS
  description: RNA oligonucleotide identification and optional MS1 label-free quantification with OpenMS.
  repository: poshul/nase-weis
  domain: other
  image: ghcr.io/poshul/nase-weis
inputs:
  mzML-files:
    types: [mzML, raw, d]
    multiple: false
    description: One MS/MS acquisition (mzML, Thermo RAW or Bruker directory).
  fasta-files:
    types: [fasta, fa, faa]
    multiple: false
    description: RNA sequence database, including bracketed MODOMICS modifications.
  digest-files:
    types: [oms]
    multiple: false
    description: Previously generated NASE RNA digest.
  bedrmod-mapping-files:
    types: [csv]
    multiple: false
    description: Custom bedRMod modification mapping.
  database-files:
    types: [fasta, fa, faa]
    multiple: true
    description: RNA or protein FASTA inputs for the standalone database builder.
  neighbor-files:
    types: [fasta, fa, faa]
    multiple: false
    description: Relevant proteins for NeighborSearch.
workflows:
  - name: NASEWEIS
    class: src/Workflow.py:Workflow
    inputs: [mzML-files, fasta-files, digest-files, bedrmod-mapping-files]
    steps:
      - {tool: DecoyDatabase, in: fasta-files, optional: true}
      - {tool: NucleicAcidSearchEngine, in: mzML-files}
      - {tool: FeatureFinderMetaboIdent, in: mzML-files, optional: true}
      - {tool: TextExporter, in: quantification/features.featureXML, optional: true}
    presets: false
  - name: Decoy Database
    class: src/DecoyWorkflow.py:DecoyWorkflow
    inputs: [database-files, neighbor-files]
    steps:
      - {tool: DecoyDatabase, in: database-files}
    presets: false
results:
  - {role: table, workflow: NASEWEIS, title: Oligonucleotide spectrum matches, source: mztab_results}
  - {role: table, workflow: NASEWEIS, title: MS1 feature intensities, source: quantification}
pages:
  - content/quickstart.py
  - content/topp_workflow_file_upload.py
  - content/naseweis.py
  - content/topp_workflow_execution.py
  - content/topp_workflow_results.py
  - content/decoy_database.py
deploy:
  k8s:
    enabled: false
    hosts: []
    storage: 50Gi
    worker_tier: low
  images: [full]
  docker_compose: true
  desktop: [windows, linux, macos]
  online_deployment: false
sync:
  app_owned:
    - app.yaml
    - app.py
    - settings.json
    - default-parameters.json
    - presets.json
    - README.md
    - docs/lfq.md
    - content/*
    - src/Workflow.py
    - src/naseweis_results.py
    - src/naseweis_tools.py
    - src/naseweis_lfq.py
    - src/DecoyWorkflow.py
    - openms-runtime.json
    - docker/Dockerfile.app
    - docker/restore_tool_registry.py
    - requirements-dev.txt
    - test.py
    - src/plot_full_coverage.py
    - tests/test_naseweis*.py
    - test_gui.py
    - .coveragerc
    - .github/workflows/naseweis-regressions.yml
    - docker/Dockerfile.test
    - scripts/check_regressions.py
    - scripts/generate_naseweis_reference.py
    - tests/conftest.py
    - tests/naseweis_reference.py
    - tests/data/naseweis/*
    - src/python-tools/*
    - example-data/*
    - assets/*
    - k8s/overlays/*
    - k8s/argocd/*
    - CLAUDE.app.md
    - conda-requirements.txt
