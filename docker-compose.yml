services:
  naseweis:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    image: naseweis:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      WORKSPACES_DIR: /workspaces-streamlit-template
      LOCAL_WORKSPACES_DIR: /workspaces-streamlit-template
      STREAMLIT_SERVER_COUNT: "1"
    volumes:
      - naseweis-workspaces:/workspaces-streamlit-template
    healthcheck:
      test: ["CMD", "/root/miniforge3/envs/streamlit-env/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
volumes:
  naseweis-workspaces:
