name: NASEWEIS regressions
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: naseweis-regressions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pinned-openms-regressions:
    name: NASEWEIS pinned OpenMS regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build current app and run all regression checks
        run: python3 scripts/check_regressions.py --container
      - name: Preserve test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naseweis-regression-reports
          path: .local/regressions/*.xml
          if-no-files-found: warn
          retention-days: 14
